version: "3.9"
services:
  dashboard:
    image: maae120617/network-d:latest
    build: .
    ports:
      - "8765:8765"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build && npm start"
    ports:
      - "3100:3000"
    restart: unless-stopped
