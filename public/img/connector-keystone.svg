<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24">
  <rect width="36" height="24" fill="#0b0f14"/>
  <!-- Keystone jack faceplate -->
  <rect x="6" y="3" width="24" height="18" rx="2" fill="#1a2531" stroke="#3ea6ff" stroke-width="1.5"/>
  <!-- RJ-45 port in center -->
  <rect x="12" y="6" width="12" height="12" rx="1" fill="#061018" stroke="#3ea6ff" stroke-width="1"/>
  <!-- 8 contacts -->
  <g stroke="#ffd700" stroke-width="0.8">
    <line x1="13" y1="7" x2="13" y2="17"/>
    <line x1="14.5" y1="7" x2="14.5" y2="17"/>
    <line x1="16" y1="7" x2="16" y2="17"/>
    <line x1="17.5" y1="7" x2="17.5" y2="17"/>
    <line x1="19" y1="7" x2="19" y2="17"/>
    <line x1="20.5" y1="7" x2="20.5" y2="17"/>
    <line x1="22" y1="7" x2="22" y2="17"/>
    <line x1="23.5" y1="7" x2="23.5" y2="17"/>
  </g>
  <!-- Snap clips on sides -->
  <rect x="5" y="8" width="2" height="8" rx="1" fill="#3ea6ff"/>
  <rect x="29" y="8" width="2" height="8" rx="1" fill="#3ea6ff"/>
</svg>
