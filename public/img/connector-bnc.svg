<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24">
  <rect width="36" height="24" fill="#0b0f14"/>
  <!-- BNC connector - bayonet mount -->
  <rect x="6" y="4" width="24" height="16" rx="1.5" fill="#1a2531" stroke="#3fb950" stroke-width="1.5"/>
  <!-- Center pin -->
  <circle cx="18" cy="12" r="2.5" fill="#ffd700" stroke="#b8860b" stroke-width="0.5"/>
  <circle cx="18" cy="12" r="1" fill="#2a2a2a"/>
  <!-- Insulator -->
  <circle cx="18" cy="12" r="5" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <!-- Bayonet lugs (two slots) -->
  <g stroke="#3fb950" stroke-width="2.5" stroke-linecap="round">
    <line x1="13" y1="6" x2="13" y2="18"/>
    <line x1="23" y1="6" x2="23" y2="18"/>
  </g>
  <!-- Rotating ring indicator -->
  <path d="M11 5 A7 7 0 0 1 25 5" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
