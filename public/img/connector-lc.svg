<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24">
  <rect width="36" height="24" fill="#0b0f14"/>
  <!-- LC connector - smaller, duplex -->
  <rect x="5" y="5" width="26" height="14" rx="1.5" fill="#1a2531" stroke="#f08a5d" stroke-width="1.5"/>
  <!-- Two ceramic ferrules side by side -->
  <circle cx="14" cy="12" r="3" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
  <circle cx="22" cy="12" r="3" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
  <circle cx="14" cy="12" r="1" fill="#2a2a2a"/>
  <circle cx="22" cy="12" r="1" fill="#2a2a2a"/>
  <!-- Latch clip -->
  <rect x="4" y="7" width="3" height="10" rx="1" fill="#f08a5d"/>
  <!-- Duplex clip between ferrules -->
  <rect x="17" y="9" width="5" height="6" rx="1" fill="#f08a5d" opacity="0.7"/>
</svg>
