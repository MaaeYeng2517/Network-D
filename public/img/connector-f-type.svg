<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24">
  <rect width="36" height="24" fill="#0b0f14"/>
  <!-- F-Type connector - threaded -->
  <rect x="6" y="4" width="24" height="16" rx="1.5" fill="#1a2531" stroke="#3fb950" stroke-width="1.5"/>
  <!-- Center pin (longer) -->
  <line x1="18" y1="5" x2="18" y2="19" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Threaded nut -->
  <g stroke="#3fb950" stroke-width="1.5">
    <ellipse cx="18" cy="12" rx="8" ry="6" fill="none"/>
    <ellipse cx="18" cy="12" rx="7" ry="5" fill="none"/>
    <ellipse cx="18" cy="12" rx="6" ry="4" fill="none"/>
  </g>
  <!-- RG-6 cable entry -->
  <rect x="16" y="20" width="4" height="6" fill="#3fb950"/>
</svg>
