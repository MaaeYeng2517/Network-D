<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1d3a"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6ab0f3"/>
      <stop offset="100%" style="stop-color:#3ea6ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Network nodes -->
  <circle cx="32" cy="32" r="10" fill="url(#accent)" opacity="0.9"/>
  <circle cx="96" cy="32" r="10" fill="url(#accent)" opacity="0.9"/>
  <circle cx="32" cy="96" r="10" fill="#f08a5d" opacity="0.9"/>
  <circle cx="96" cy="96" r="10" fill="#f08a5d" opacity="0.9"/>
  
  <!-- Connections -->
  <path d="M42 32 L86 32" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 42 L32 86" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M42 96 L86 96" stroke="#f08a5d" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M96 42 L96 86" stroke="#f08a5d" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M42 42 L86 86" stroke="#6ab0f3" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" stroke-dasharray="8,4"/>
  <path d="M86 42 L42 86" stroke="#f08a5d" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" stroke-dasharray="8,4"/>
  
  <!-- Center hub -->
  <circle cx="64" cy="64" r="14" fill="url(#accent)" opacity="0.3"/>
  <circle cx="64" cy="64" r="8" fill="#0b1d3a" stroke="url(#accent)" stroke-width="2"/>
  <text x="64" y="69" text-anchor="middle" fill="url(#accent)" font-size="11" font-weight="bold" font-family="monospace">NCP</text>
</svg>